<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Nomia — Find the Perfect Baby Name">
<meta property="og:description" content="Answer 7 questions. Our AI searches 3 million names across 190 cultures to find the one that's truly yours. Free to start.">
<meta property="og:image" content="https://raw.githubusercontent.com/nickmistretta/baby-names-api/main/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raw.githubusercontent.com/nickmistretta/baby-names-api/main/og-image.png">
<title>Nomia — Match My Taste</title>
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/nickmistretta/baby-names-api/main/nomia-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2B3A;
    --navy-deep: #152230;
    --navy-mid: #243548;
    --cream: #FDFAF7;
    --blush: #F2D9D9;
    --rose: #E8B4B8;
    --dusty-rose: #C9737A;
    --silver: #8B9EB0;
    --white: #FFFFFF;
    --off-white: #F8F6F3;
    --terracotta: #C9737A;
    --muted: #8B9EB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(201,115,122,0.06);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .header h1 em { font-style: italic; color: var(--terracotta); }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--silver);
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.2s;
    letter-spacing: 0.04em;
  }

  .back-link:hover { color: var(--cream); }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #C9737A, #E8B4B8);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card — white like quiz.html */
  .question-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(122,92,68,0.08);
    animation: fadeUp 0.6s ease both;
  }

  .question-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dusty-rose);
    font-weight: 400;
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .question-hint {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 28px;
  }

  /* Options */
  .options-grid { display: grid; gap: 10px; }
  .options-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .options-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--navy);
    line-height: 1.4;
  }

  .option-btn:hover { border-color: var(--dusty-rose); background: #FBF7F2; transform: translateY(-1px); }
  .option-btn.selected { border-color: var(--terracotta); background: #FDF0EC; color: var(--terracotta); }

  .option-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 0.5px solid rgba(28,43,58,0.1);
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }

  .option-btn.selected .option-dot { background: var(--dusty-rose); border-color: var(--terracotta); }
  .option-btn.selected .option-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: white; }

  .name-type-input {
    background: none;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--navy);
    width: 220px;
    min-width: 100px;
  }

  .name-type-input::placeholder { color: var(--muted); }

  /* Name bubbles */
  .bubbles-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  .bubble-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 0 8px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  .bubble-spinner {
    width: 16px; height: 16px;
    border: 1.5px solid rgba(201,115,122,0.3);
    border-top-color: var(--dusty-rose);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .name-bubble {
    padding: 9px 18px;
    background: var(--off-white);
    border: 0.5px solid rgba(28,43,58,0.12);
    border-radius: 99px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-style: italic;
    color: var(--navy);
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
  }

  .name-bubble:hover {
    border-color: var(--dusty-rose);
    background: #FBF7F2;
    transform: translateY(-1px);
  }

  .name-bubble.selected {
    background: rgba(201,115,122,0.12);
    border-color: var(--dusty-rose);
    color: var(--dusty-rose);
  }

  .bubble-divider {
    width: 100%;
    height: 0.5px;
    background: rgba(28,43,58,0.08);
    margin: 4px 0 16px;
  }

  .bubble-add-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bubble-add-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--off-white);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
  }

  .bubble-add-input:focus { border-color: var(--dusty-rose); }
  .bubble-add-input::placeholder { color: var(--muted); }

  .bubble-add-btn {
    padding: 10px 18px;
    background: var(--dusty-rose);
    border: none;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .bubble-add-btn:hover { background: #b85f66; }

  .input-hint {
    font-size: 12px;
    color: rgba(28,43,58,0.35);
    margin-top: 6px;
  }

  /* Text input */
  .text-input {
    width: 100%;
    padding: 14px 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
  }

  .text-input:focus { border-color: var(--dusty-rose); }
  .text-input::placeholder { color: var(--muted); font-weight: 300; }

  /* Nav */
  .nav {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .btn-back {
    padding: 14px 24px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: rgba(255,255,255,0.3); color: var(--cream); }

  .btn-next {
    flex: 1;
    padding: 14px 24px;
    background: var(--dusty-rose);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-next:hover { background: var(--navy-deep); transform: translateY(-1px); }

  /* Loading */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 20px;
  }

  .loading-pulse-wrap {
    position: relative;
    width: 240px; height: 240px;
    margin: 0 auto 48px;
    display: flex; align-items: center; justify-content: center;
  }

  .loading-pulse-wrap::before,
  .loading-pulse-wrap::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.15);
    animation: pulseRing 2.4s ease-out infinite;
  }

  .loading-pulse-wrap::before { width: 100%; height: 100%; animation-delay: 0s; }
  .loading-pulse-wrap::after { width: 75%; height: 75%; animation-delay: 0.4s; }

  .loading-pulse-inner {
    width: 50%; height: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,115,122,0.6) 0%, rgba(201,115,122,0.3) 60%, transparent 100%);
    animation: pulseCore 2.4s ease-in-out infinite;
    position: relative; z-index: 1;
  }

  .loading-pulse-ring {
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.08);
    width: 140%; height: 140%;
    animation: pulseRing 2.4s ease-out infinite;
    animation-delay: 0.8s;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.6); opacity: 0.8; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .loading-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.2;
    animation: fadeUp 0.8s ease both;
  }

  .loading-sub {
    font-size: 16px;
    color: var(--silver);
    font-weight: 300;
    letter-spacing: 0.06em;
    animation: fadeUp 0.8s 0.2s ease both;
    min-height: 24px;
  }

  /* Results */
  .results-header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease both;
  }

  .results-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 400;
    color: var(--cream);
    margin-bottom: 8px;
  }

  .results-header p { font-size: 14px; color: var(--silver); font-weight: 300; }

  .name-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .name-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(122,92,68,0.12); }

  .save-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: rgba(28,43,58,0.2);
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    transition: all 0.2s;
    align-self: center;
    line-height: 1;
  }

  .save-btn:hover { color: var(--dusty-rose); transform: scale(1.2); }
  .save-btn.saved { color: var(--dusty-rose); }

  .name-rank {
    font-size: 11px;
    color: var(--dusty-rose);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 24px;
    padding-top: 4px;
  }

  .name-info { flex: 1; }

  .name-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 4px;
  }

  .name-origin {
    font-size: 12px;
    color: var(--dusty-rose);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .name-meaning { font-size: 13px; color: var(--silver); font-weight: 300; line-height: 1.5; }

  .name-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .name-tag {
    padding: 3px 10px;
    background: rgba(28,43,58,0.05);
    border-radius: 99px;
    font-size: 11px;
    color: var(--silver);
    letter-spacing: 0.04em;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @media (max-width: 480px) {
    .options-grid.cols-2 { grid-template-columns: 1fr; }
    .options-grid.cols-3 { grid-template-columns: 1fr; }
    .question-card { padding: 28px 20px; }
  }
</style>
</head>

      <p>Tell us names you already love and we'll find more with the same energy, roots, and magic.</p>

    <div class="progress-wrap">

    </div>

  </div>

  <!-- LOADING SCREEN -->
  <div class="screen" id="screen-loading">
    <div class="loading-screen">
      <div class="loading-pulse-wrap">
        <div class="loading-pulse-ring"></div>
        <div class="loading-pulse-inner"></div>
      </div>
      <div class="loading-text">Finding your matches…</div>
      <div class="loading-sub" id="loading-msg">Analysing your taste profile</div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="screen" id="screen-results">
    <div style="margin-bottom:24px; animation: fadeUp 0.6s ease both;">
      <a href="dashboard.html" class="back-link">← Back to dashboard</a>
    </div>
    <div class="results-header">
      <h2>Your matched names</h2>
      <p id="results-sub">25 names matched to your taste</p>
    </div>
    <div id="names-list"></div>
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:32px; align-items:center;">
      <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--dusty-rose); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:300; color:white; cursor:pointer; transition:all 0.2s; letter-spacing:0.04em;">
        ✦ Match again with different names
      </button>
      <a href="dashboard.html" style="width:100%; padding:14px; background:transparent; border:0.5px solid rgba(255,255,255,0.15); border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:300; color:rgba(253,250,247,0.6); text-align:center; text-decoration:none; letter-spacing:0.04em; display:block;">
        ← Back to dashboard
      </a>
    </div>
  </div>

</div>

<script>
  // Auth check
  const userEmail = localStorage.getItem('nomia_user_email');
  if (!userEmail) window.location.href = 'dashboard.html';

  // State
  let current = 0;
  let answers = {};
  const TOTAL_STEPS = 6;

  const steps = [
    { id: 'gender',   type: 'single' },
    { id: 'origin',   type: 'multi' },
    { id: 'names',    type: 'bubbles' },
    { id: 'vibes',    type: 'multi' },
    { id: 'nickname', type: 'single' },
    { id: 'lastname', type: 'text' }
  ];

  const stepConfig = {
    gender: {
      label: 'Step 1',
      text: 'What gender are you looking for?',
      hint: "We'll use this as the foundation for every match.",
      options: ['Girl', 'Boy', 'Gender-neutral', 'Surprise me']
    },
    origin: {
      label: 'Step 2',
      text: 'Any country of origin to draw from?',
      hint: 'Select as many as you like — or skip if no preference.',
      options: [
        'Irish', 'Scottish', 'English', 'French', 'Italian',
        'Spanish', 'Portuguese', 'German', 'Scandinavian', 'Greek',
        'Russian', 'Japanese', 'Chinese', 'Indian', 'Arabic',
        'Hebrew', 'Nigerian', 'Ethiopian', 'Latin American', 'No preference'
      ]
    },
    names: {
      label: 'Step 3',
      text: 'Pick names you already love',
      hint: 'Select as many as feel right — or add your own below'
    },
    vibes: {
      label: 'Step 4',
      text: 'What do you love about those names?',
      hint: 'Pick everything that resonates.',
      options: [
        'The sound and rhythm',
        'The origin and meaning',
        'How rare and unique they are',
        'The soft, gentle feel',
        'The strength and boldness',
        'The vintage, timeless quality',
        'The nature connection',
        'How literary and poetic they feel'
      ]
    },
    nickname: {
      label: 'Step 5',
      text: 'Should the name have a good nickname?',
      hint: 'Think Josephine → Jo, Theodore → Theo, Beatrice → Bea.',
      options: ['Yes please', 'No preference', 'Not important']
    },
    lastname: {
      label: 'Step 6',
      text: 'Last name for flow testing?',
      hint: "We'll check how each name sounds with your surname.",
      placeholder: 'Your last name (optional)'
    }
  };

  function renderQ() {
    const step = steps[current];
    const cfg = stepConfig[step.id];
    const card = document.getElementById('question-card');
    const pct = Math.round(((current + 1) / TOTAL_STEPS) * 100);

    document.getElementById('progress-label').textContent = `Step ${current + 1} of ${TOTAL_STEPS}`;
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('btn-back').style.display = current > 0 ? 'block' : 'none';

    const nextBtn = document.getElementById('btn-next');
    nextBtn.textContent = current === TOTAL_STEPS - 1 ? 'Find my matches ✦' : 'Continue →';

    let bodyHTML = '';

    if (step.type === 'bubbles') {
      const bubbleList = window._suggestedBubbles || [];
      if (bubbleList.length === 0) {
        bodyHTML = `<div class="bubble-loading"><div class="bubble-spinner"></div> Loading name suggestions…</div>`;
      } else {
        const selected = answers.names || [];
        bodyHTML = `
          <div class="bubbles-wrap" id="bubbles-wrap">
            ${bubbleList.map(n => `
              <button class="name-bubble${selected.includes(n) ? ' selected' : ''}" data-name="${n}">${n}</button>
            `).join('')}
          </div>
          <div class="bubble-divider"></div>
          <div class="bubble-add-wrap">
            <input type="text" class="bubble-add-input" id="bubble-add-input" placeholder="Add your own name…" autocomplete="off" />
            <button class="bubble-add-btn" onclick="bubbleAddCustom()">Add</button>
          </div>
        `;
      }
    } else if (step.type === 'multi') {
      bodyHTML = `<div class="options-grid cols-2" id="multi-grid">` +
        cfg.options.map(o => `
          <button class="option-btn${(answers[step.id] || []).includes(o) ? ' selected' : ''}" data-val="${o}">
            <span class="option-dot"></span>${o}
          </button>`).join('') +
        `</div>`;
    } else if (step.type === 'single') {
      const cols = cfg.options.length === 3 ? 'cols-3' : 'cols-2';
      bodyHTML = `<div class="options-grid ${cols}" id="single-grid">` +
        cfg.options.map(o => `
          <button class="option-btn${answers[step.id] === o ? ' selected' : ''}" data-val="${o}">
            <span class="option-dot"></span>${o}
          </button>`).join('') +
        `</div>`;
    } else if (step.type === 'text') {
      bodyHTML = `<input class="text-input" type="text" id="text-answer" placeholder="${cfg.placeholder}" value="${answers[step.id] || ''}" autocomplete="off" />`;
    }

    card.innerHTML = `
      <div class="question-label">${cfg.label}</div>
      <div class="question-text">${cfg.text}</div>
      <div class="question-hint">${cfg.hint}</div>
      ${bodyHTML}
    `;

    // Wire bubbles
    if (step.type === 'bubbles') {
      if (!answers.names) answers.names = [];
      wireBubbles();
      const addInp = document.getElementById('bubble-add-input');
      if (addInp) {
        addInp.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); bubbleAddCustom(); }
        });
      }
    }

    // Wire multi-select
    if (step.type === 'multi') {
      if (!answers[step.id]) answers[step.id] = [];
      card.querySelectorAll('#multi-grid .option-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const val = this.dataset.val;
          if (answers[step.id].includes(val)) {
            answers[step.id] = answers[step.id].filter(v => v !== val);
            this.classList.remove('selected');
          } else {
            answers[step.id].push(val);
            this.classList.add('selected');
          }
        });
      });
    }

    // Wire single-select
    if (step.type === 'single') {
      card.querySelectorAll('#single-grid .option-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          card.querySelectorAll('#single-grid .option-btn').forEach(b => b.classList.remove('selected'));
          this.classList.add('selected');
          answers[step.id] = this.dataset.val;
        });
      });
    }

    // Wire text
    if (step.type === 'text') {
      const inp = card.querySelector('.text-input');
      if (inp) inp.addEventListener('input', function() { answers[step.id] = this.value; });
    }

    card.style.animation = 'none';
    requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.5s ease both'; });
  }

  function wireBubbles() {
    document.querySelectorAll('.name-bubble').forEach(btn => {
      btn.addEventListener('click', function() {
        const name = this.dataset.name;
        if (!answers.names) answers.names = [];
        if (answers.names.includes(name)) {
          answers.names = answers.names.filter(n => n !== name);
          this.classList.remove('selected');
        } else {
          answers.names.push(name);
          this.classList.add('selected');
        }
      });
    });
  }

  function bubbleAddCustom() {
    const inp = document.getElementById('bubble-add-input');
    if (!inp) return;
    const name = inp.value.trim();
    if (!name) return;
    if (!answers.names) answers.names = [];
    if (answers.names.includes(name)) { inp.value = ''; return; }
    // Add to suggested list and re-render bubbles section
    if (!window._suggestedBubbles) window._suggestedBubbles = [];
    if (!window._suggestedBubbles.includes(name)) window._suggestedBubbles.push(name);
    answers.names.push(name);
    inp.value = '';
    // Rebuild the bubbles wrap
    const wrap = document.getElementById('bubbles-wrap');
    if (wrap) {
      const newBtn = document.createElement('button');
      newBtn.className = 'name-bubble selected';
      newBtn.dataset.name = name;
      newBtn.textContent = name;
      wrap.appendChild(newBtn);
      newBtn.addEventListener('click', function() {
        answers.names = answers.names.filter(n => n !== name);
        this.classList.remove('selected');
      });
    }
  }

  async function fetchBubbleSuggestions() {
    const gender = answers.gender || 'any';
    const origin = answers.origin && answers.origin !== 'No preference' ? answers.origin : 'any origin';
    try {
      const res = await fetch('https://project-rz9q4.vercel.app/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 400,
          messages: [{
            role: 'user',
            content: `List exactly 24 beautiful ${gender} baby names with ${origin} roots. Return ONLY a JSON array of name strings, no explanations, no markdown: ["Name1","Name2",...]`
          }]
        })
      });
      const data = await res.json();
      let raw = data.content[0].text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
      const start = raw.indexOf('['), end = raw.lastIndexOf(']');
      return JSON.parse(raw.slice(start, end + 1));
    } catch(e) {
      console.error('Bubble fetch failed', e);
      return [];
    }
  }

  function nextQ() {
    const step = steps[current];

    // Validate required steps
    if (step.type === 'bubbles' && (!answers.names || answers.names.length < 1)) {
      const card = document.getElementById('question-card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'shake 0.3s ease';
      return;
    }
    if (step.type === 'single' && !answers[step.id]) {
      const card = document.getElementById('question-card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'shake 0.3s ease';
      return;
    }
    // multi and text are optional

    if (current < TOTAL_STEPS - 1) {
      const nextStep = steps[current + 1];
      // If we're about to show the bubbles step, fetch suggestions first
      if (nextStep && nextStep.type === 'bubbles') {
        current++;
        window._suggestedBubbles = [];
        renderQ(); // shows loading state immediately
        window.scrollTo({ top: 0, behavior: 'smooth' });
        fetchBubbleSuggestions().then(names => {
          window._suggestedBubbles = names;
          renderQ(); // re-render with bubbles populated
        });
      } else {
        current++;
        renderQ();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } else {
      generateNames();
    }
  }

  function prevQ() {
    if (current > 0) {
      current--;
      renderQ();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  const loadingMessages = [
    'Analysing your taste profile…',
    'Finding names with the same energy…',
    'Exploring roots and origins…',
    'Curating your matches…'
  ];

  async function generateNames() {
    document.getElementById('screen-quiz').classList.remove('active');
    document.getElementById('screen-loading').classList.add('active');

    let msgIdx = 0;
    const msgEl = document.getElementById('loading-msg');
    const msgInterval = setInterval(() => {
      msgIdx = (msgIdx + 1) % loadingMessages.length;
      msgEl.textContent = loadingMessages[msgIdx];
    }, 1800);

    // Check cache before hitting the API
    const cacheKey = buildMatchCacheKey(answers);
    console.log('Cache key:', cacheKey);
    const cachedResult = await checkMatchCache(cacheKey);
    if (cachedResult) {
      console.log('✅ Served from cache');
      incrementMatchCacheHit(cacheKey, cachedResult.hit_count);
      clearInterval(msgInterval);
      showResults(cachedResult.free_names);
      return;
    }

    const originSelections = (answers.origin || []).filter(o => o !== 'No preference');
    const originText = originSelections.length > 0 ? originSelections.join(', ') : null;
    const vibesText = answers.vibes && answers.vibes.length > 0 ? answers.vibes.join(', ') : null;
    const lastName = answers.lastname || '';
    const nicknamePreference = answers.nickname || 'No preference';
    const nicknameInstruction = nicknamePreference === 'Yes please'
      ? 'Nickname: prioritise names with great short forms or nicknames (e.g. Josephine → Jo, Theodore → Theo, Beatrice → Bea). Note the nickname in the tags.'
      : nicknamePreference === 'Not important'
      ? 'Nickname: avoid names commonly shortened — suggest names that stand well on their own.'
      : '';

    const genderInstruction = (answers.gender === 'Girl' || answers.gender === 'Boy')
      ? `CRITICAL: Gender is a HARD filter — only suggest ${answers.gender} names. Do not suggest names outside this gender regardless of the inspiration names provided.`
      : `Gender preference: ${answers.gender || 'no preference'} — feel free to suggest names across genders.`;

    const prompt = `You are a baby name expert. The user loves these names: ${(answers.names || []).join(', ')}.

${genderInstruction}

${originText ? `Country of origin: ${originText} — prioritise names rooted in this tradition.` : ''}
${vibesText ? `What they love about their inspiration names: ${vibesText}` : ''}
${nicknameInstruction ? nicknameInstruction + '\n' : ''}${lastName ? `Last name for flow: ${lastName} — note how each suggested name pairs with this surname` : ''}

Suggest exactly 25 baby names that feel like a natural extension of what they already love — same energy, roots, sounds, or qualities. Do not repeat any of the inspiration names.

Respond ONLY with a valid JSON array, no markdown, no explanation:
[{"name": "...", "origin": "...", "meaning": "...", "tags": ["...", "..."]}]

Tags should capture why each name matches their taste, e.g. "same Celtic roots", "similar soft sound", "equally rare", "nickname: Kit", etc.`;

    try {
      const res = await fetch('https://project-rz9q4.vercel.app/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 4000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await res.json();
      let rawText = data.content[0].text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
      const start = rawText.indexOf('[');
      const end = rawText.lastIndexOf(']');
      const names = JSON.parse(rawText.slice(start, end + 1));

      storeMatchCache(cacheKey, names); // fire and forget
      console.log('🌐 Served from API — stored in cache');
      clearInterval(msgInterval);
      showResults(names);
    } catch (e) {
      console.error(e);
      clearInterval(msgInterval);
      showResults([]);
    }
  }

  // Track saved names for toggle behavior
  const savedNames = new Set();
  const SUPABASE_URL = 'https://naokzfwnttyoizanotcw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hb2t6ZndudHR5b2l6YW5vdGN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MzIyOTksImV4cCI6MjA5MTUwODI5OX0.Tzxl7Px0GaBs4Cmw9KRn7Y4YMwcDvVSbLgIZkO6QVFc';

  // ── Cache helpers ───────────────────────────────────────
  function buildMatchCacheKey(a) {
    const norm = v => (v || '').toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    const names   = (a.names   || []).slice().sort().map(norm).join('_');
    const origins = (a.origin  || []).slice().sort().map(norm).join('_');
    const vibes   = (a.vibes   || []).slice().sort().map(norm).join('_');
    return `match-${[names, norm(a.gender), origins, vibes, norm(a.nickname), norm(a.lastname)].join('-')}`;
  }

  async function checkMatchCache(key) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/cached_results?cache_key=eq.${encodeURIComponent(key)}&select=free_names,hit_count`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) return data[0];
    } catch (e) { console.warn('Cache read failed:', e); }
    return null;
  }

  async function storeMatchCache(key, names) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/cached_results`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ cache_key: key, free_names: names, premium_names: [] })
      });
    } catch (e) { console.warn('Cache store failed:', e); }
  }

  async function incrementMatchCacheHit(key, count) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/cached_results?cache_key=eq.${encodeURIComponent(key)}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ hit_count: count + 1 })
      });
    } catch (e) { console.warn('Cache increment failed:', e); }
  }
  // ────────────────────────────────────────────────────────

  async function saveName(name, btn) {
    if (!userEmail) return;

    if (savedNames.has(name.name)) {
      // Already saved — toggle off
      btn.textContent = '♡';
      btn.classList.remove('saved');
      savedNames.delete(name.name);
      try {
        await fetch(
          `${SUPABASE_URL}/rest/v1/saved_names?email=eq.${encodeURIComponent(userEmail)}&name=eq.${encodeURIComponent(name.name)}`,
          {
            method: 'DELETE',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
      } catch (e) {
        console.error('Delete failed', e);
        btn.textContent = '♥';
        btn.classList.add('saved');
        savedNames.add(name.name);
      }
    } else {
      // Not saved — toggle on
      btn.textContent = '♥';
      btn.classList.add('saved');
      savedNames.add(name.name);
      try {
        await fetch('https://project-rz9q4.vercel.app/api/save-names', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, names: [name] })
        });
      } catch (e) {
        console.error('Save failed', e);
        btn.textContent = '♡';
        btn.classList.remove('saved');
        savedNames.delete(name.name);
      }
    }
  }

  function showResults(names) {
    document.getElementById('screen-loading').classList.remove('active');
    document.getElementById('screen-results').classList.add('active');
    document.getElementById('results-sub').textContent = `${names.length} names matched to your taste`;

    // Store names array for save callbacks
    window._resultNames = names;

    document.getElementById('names-list').innerHTML = names.map((n, i) => `
      <div class="name-card" style="animation-delay:${i * 0.05}s">
        <div class="name-rank">${String(i+1).padStart(2,'0')}</div>
        <div class="name-info">
          <div class="name-title">${n.name}</div>
          <div class="name-origin">${n.origin}</div>
          <div class="name-meaning">${n.meaning}</div>
          <div class="name-tags">${(n.tags||[]).map(t => `<span class="name-tag">${t}</span>`).join('')}</div>
        </div>
        <button class="save-btn" onclick="saveName(window._resultNames[${i}], this)" title="Save to dashboard">♡</button>
      </div>
    `).join('');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Init
  renderQ();
</script>
</body>
</html>
