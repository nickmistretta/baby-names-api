<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Nomia — Find Your Baby's Name</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2B3A;
    --navy-deep: #152230;
    --navy-mid: #243548;
    --cream: #FDFAF7;
    --blush: #F2D9D9;
    --rose: #E8B4B8;
    --dusty-rose: #C9737A;
    --silver: #8B9EB0;
    --white: #FFFFFF;
    --terracotta: #C9737A;
    --bark: #FDFAF7;
    --charcoal: #FDFAF7;
    --muted: #8B9EB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(201,115,122,0.06);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 8px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 16px;
    animation: fadeUp 0.8s ease both;
  }

  .header-leaf {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
    filter: sepia(0.3);
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .header h1 em {
    font-style: italic;
    color: var(--terracotta);
  }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 20px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #C9737A, #E8B4B8);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card */
  .question-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 20px;
    padding: 24px 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(122,92,68,0.08);
    animation: fadeUp 0.6s ease both;
  }

  .question-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 400;
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .question-hint {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 18px;
  }

  /* Options */
  .options-grid {
    display: grid;
    gap: 10px;
  }

  .options-grid.cols-2 {
    grid-template-columns: 1fr 1fr;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--navy);
    line-height: 1.4;
  }

  .option-btn:hover {
    border-color: var(--clay);
    background: #FBF7F2;
    transform: translateY(-1px);
  }

  .option-btn.selected {
    border-color: var(--terracotta);
    background: #FDF0EC;
    color: var(--terracotta);
  }

  .option-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 0.5px solid rgba(28,43,58,0.1);
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option-btn.selected .option-dot {
    background: var(--dusty-rose);
    border-color: var(--terracotta);
  }

  .option-btn.selected .option-dot::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
  }

  /* Text input */
  .text-input {
    width: 100%;
    padding: 14px 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
  }

  .text-input:focus {
    border-color: var(--clay);
  }

  .text-input::placeholder {
    color: var(--muted);
    font-weight: 300;
  }

  /* Gender toggle */
  .gender-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 640px) {
    .container {
      padding-top: 4px;
    }
    .header {
      margin-bottom: 10px;
    }
    .question-card {
      padding: 20px 18px;

  @media (max-width: 480px) {
    .gender-toggle {
      grid-template-columns: 1fr;
    }

  .gender-btn {
    flex: 1;
    padding: 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Lato', sans-serif;

    color: var(--navy);

  .gender-btn:hover { border-color: var(--clay); }
  .gender-btn.selected { border-color: var(--terracotta); background: #FDF0EC; color: var(--terracotta); }

  /* Nav buttons */
  .nav {

  .btn-back {

  .btn-back:hover { border-color: var(--clay); color: var(--navy); }

  .btn-next {

    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-next:hover { background: var(--navy); transform: translateY(-1px); }
  .btn-next:disabled { background: var(--sand); color: var(--muted); cursor: not-allowed; transform: none; }

  /* Loading screen */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 20px;
  }

  .loading-pulse-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loading-pulse-wrap::before,
  .loading-pulse-wrap::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.15);
    animation: pulseRing 2.4s ease-out infinite;
  }

  .loading-pulse-wrap::before { width: 100%; height: 100%; animation-delay: 0s; }
  .loading-pulse-wrap::after { width: 75%; height: 75%; animation-delay: 0.4s; }

  .loading-pulse-inner {
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,115,122,0.6) 0%, rgba(201,115,122,0.3) 60%, transparent 100%);
    animation: pulseCore 2.4s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }

  .loading-pulse-ring {
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.08);
    width: 140%;
    height: 140%;
    animation: pulseRing 2.4s ease-out infinite;
    animation-delay: 0.8s;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.6); opacity: 0.8; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .loading-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    animation: fadeUp 0.8s ease both;
  }

  .loading-sub {
    font-size: 16px;
    color: var(--silver);
    font-weight: 300;
    letter-spacing: 0.06em;
    animation: fadeUp 0.8s 0.2s ease both;
    min-height: 24px;
  }

  /* Results screen */
  .results-header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease both;
  }

  .results-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 400;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .results-header p {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  .name-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .name-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(122,92,68,0.12);
  }

  .save-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: rgba(28,43,58,0.2);
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    transition: all 0.2s;
    align-self: center;
    line-height: 1;
  }
  .save-btn:hover { color: var(--dusty-rose); transform: scale(1.2); }
  .save-btn.saved { color: var(--dusty-rose); }

  .name-rank {
    font-size: 11px;
    color: var(--clay);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 24px;
    padding-top: 4px;
  }

  .name-info { flex: 1; }

  .name-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 4px;
  }

  .name-origin {
    font-size: 12px;
    color: var(--dusty-rose);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .name-meaning {
    font-size: 13px;
    color: var(--silver);
    font-weight: 300;
    line-height: 1.5;
  }

  .name-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .name-tag {
    padding: 3px 10px;
    background: rgba(253,250,247,0.08);
    border-radius: 99px;
    font-size: 11px;
    color: var(--silver);
    letter-spacing: 0.04em;
  }

  /* Upsell card */
  /* Email capture card */
  .email-capture-card {
    background: var(--navy-mid);
    border: 0.5px solid rgba(253,250,247,0.1);
    border-radius: 20px;
    padding: 24px 24px 16px 24px;
    text-align: center;
    margin-top: 12px;
    margin-bottom: 12px;
    animation: fadeUp 0.6s 0.2s ease both;
    position: relative;
    z-index: 20;
  }

  .email-capture-eyebrow {
    font-size: 11px;
    color: var(--dusty-rose);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .email-capture-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 400;
    color: var(--cream);
    margin-bottom: 6px;

  }

  .email-capture-sub {
    font-size: 13px;
    color: var(--silver);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .email-capture-row {
    display: flex;
    gap: 8px;
    max-width: 400px;
    margin: 0 auto;
  }

  .email-capture-input {
    flex: 1;
    padding: 12px 14px;
    background: rgba(253,250,247,0.07);
    border: 0.5px solid rgba(253,250,247,0.2);
    border-radius: 10px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
  }

  .email-capture-input::placeholder { color: rgba(253,250,247,0.35); }
  .email-capture-input:focus { border-color: rgba(201,115,122,0.5); }

  .email-capture-btn {
    padding: 12px 18px;
    background: var(--dusty-rose);
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;

  .email-capture-btn:hover { opacity: 0.88; }

  .email-capture-confirm {
    font-size: 13px;
    color: var(--dusty-rose);
    letter-spacing: 0.04em;
    padding: 4px 0;
  }

  @media (max-width: 480px) {
    .email-capture-row { flex-direction: column; }
    .email-capture-btn { width: 100%; padding: 13px; }
  }

  .upsell-card {
    background: var(--navy-mid);
    border: 0.5px solid rgba(253,250,247,0.1);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    margin-top: 0;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .upsell-card::before {
    content: '';

  }

  .upsell-card::after {
    content: '';

  }

  .upsell-badge {
    display: inline-block;
    padding: 5px 14px;
    background: var(--dusty-rose);
    border-radius: 99px;

    text-transform: uppercase;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .upsell-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    color: var(--cream);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }

  .upsell-desc {
    font-size: 14px;
    color: rgba(253,250,247,0.55);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 8px;

    z-index: 1;
  }

  .upsell-includes {

    flex-direction: column;
    gap: 6px;
    margin: 16px 0 24px;

  .upsell-item {

  .upsell-item::before {
    content: '✦';
    color: var(--dusty-rose);
    font-size: 10px;
    flex-shrink: 0;
  }

  .upsell-price {
    font-family: 'Cormorant Garamond', serif;

  }

  .upsell-price span {

  }

  .upsell-once {
    font-size: 12px;
    color: rgba(253,250,247,0.4);
    margin-bottom: 20px;

    z-index: 1;
  }

  .btn-paypal {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    background: #FFC439;

    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #003087;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
    letter-spacing: 0.02em;
  }

  .btn-paypal:hover { background: #f0b429; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,196,57,0.3); }

  .paypal-logo {

  }

  .skip-link {

  .skip-link:hover { color: rgba(253,250,247,0.7); }

  /* Locked names */
  .locked-names {
    margin-top: 0;
    position: relative;

    overflow: hidden;
  }

  .locked-overlay {

    padding-bottom: 10px;
  }

  .locked-hint {

    color: var(--muted);

  .name-card.blurred {

  /* Animations */
  @keyframes fadeUp {

  @keyframes spin {

  .screen { display: none; }

let current = 0;
let answers = {};

function renderQ() {
  const q = questions[current];
  const card = document.getElementById('question-card');
  const pct = Math.round(((current + 1) / questions.length) * 100);

  document.getElementById('progress-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-back').style.display = current > 0 ? 'block' : 'none';

  let optionsHTML = '';

  if (q.type === 'gender') {
    optionsHTML = `<div class="gender-toggle">` +
      q.options.map((o, i) => `<button class="gender-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="gender-btn">${o}</button>`).join('') +
      `</div>`;
  } else if (q.type === 'single') {
    const grid = q.cols === 2 ? 'options-grid cols-2' : 'options-grid';
    optionsHTML = `<div class="${grid}">` +
      q.options.map((o, i) => `
        <button class="option-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="option-btn">
          <span class="option-dot"></span>${o}
        </button>`).join('') +
      `</div>`;
  } else if (q.type === 'text') {
    optionsHTML = `<input class="text-input" type="text" placeholder="${q.placeholder}" id="text-input-${q.id}" value="${answers[q.id] || ''}">`;
  }

  card.innerHTML = `
    <div class="question-label">${q.label}</div>
    <div class="question-text">${q.text}</div>
    <div class="question-hint">${q.hint}</div>
    ${optionsHTML}
  `;

  // Attach click listeners via JS (safe for special chars & emojis)
  card.querySelectorAll('[data-qid]').forEach(btn => {
    btn.addEventListener('click', function() {
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.val);
      const cls = this.dataset.cls;
      const q = questions[current];
      answers[qid] = q.options[idx];
      card.querySelectorAll('.' + cls).forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  if (q.type === 'text') {
    const inp = card.querySelector('.text-input');
    if (inp) inp.addEventListener('input', function() { answers[q.id] = this.value; });
  }

  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.5s ease both'; });

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = current === questions.length - 1 ? 'Find my names ✦' : 'Continue →';
}


function nextQ() {
  const q = questions[current];
  if (q.type !== 'text' && !answers[q.id]) {
    document.getElementById('question-card').style.animation = 'none';
    document.getElementById('question-card').offsetHeight;
    document.getElementById('question-card').style.animation = 'shake 0.3s ease';
    return;
  }
  if (current < questions.length - 1) {
    current++;
    renderQ();
  } else {
    generateNames();
  }
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }
}

const loadingMessages = [
  'Weaving together your preferences…',
  'Exploring name origins and meanings…',
  'Matching seasonal energy…',
  'Curating your personal collection…'
];

async function generateNames() {
  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-loading').classList.add('active');

  let msgIdx = 0;
  const msgEl = document.getElementById('loading-msg');
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % loadingMessages.length;
    msgEl.textContent = loadingMessages[msgIdx];
  }, 1800);

  const prompt = `You are a baby name expert. Treat the parent's inputs as an emotional brief — a mood board, not a shopping list. Your goal is names that feel inevitable once heard.

GENDER RULE (hard): ${answers.gender}. Girl = girl names only. Boy = boy names only. If "Gender-neutral" or "No preference" or "Surprise me" = prioritize genuinely androgynous names that work for any child without feeling like a compromise — names like Rowan, Sage, Quinn, Marlowe, River, Emerson, Avery. Only use "Surprise me" as a signal for a true 50/50 split of clearly gendered names.

NEVER use a word from the inputs as a name. "Grace" as a meaning input means elegance and ease — not the name Grace. "Joy" means radiance — not the name Joy. "Light" means luminous energy — not Luna, Luz, or Claire. Treat every input as a feeling to evoke, not a word to echo.

THE BRIEF:
Style: ${answers.style}
Culture: ${answers.culture}
Vibe: ${answers.vibe}
Meaning resonance: ${answers.meaning}
Sound: ${answers.sound || 'none specified'}
Season: ${answers.season}

STYLE:
- Classic/timeless: well-loved for decades, immediately recognizable — Elizabeth, James, Catherine, Henry, Margaret, Thomas
- Modern/fresh: feels current, popular in last 10–15 years — Isla, Finn, Nova, Declan, Aria
- Rare/unique: genuinely uncommon, not invented — real names with history that are underused
- Vintage revival: peaked 80–120 years ago, feels fresh again — Mabel, Harriet, Archie, Walter
- Nature-inspired: plants, landscape, weather, celestial bodies
- Short/strong: 1–2 syllables, punchy and confident

CULTURE:
- European/Western: cast wide — English, French, Italian, Scandinavian, German, Irish, Scottish. Mix freely, do not cluster around one nationality. Include some familiar names alongside more interesting finds.
- Latin/Spanish: Spanish, Portuguese, Latin American names
- Asian/East Asian: Japanese, Chinese, Korean names
- South Asian: Sanskrit, Hindi, Tamil names
- Middle Eastern: Arabic, Persian, Turkish names
- African/African-American: pan-African and African-American names
- Indigenous: Indigenous names with traceable cultural heritage

DIVERSITY RULES — all must be met:
- No two names from the same language family
- No two names starting with the same letter
- No name variations of each other (Kate and Katherine cannot both appear)
- Zero overlap between free and premium lists
- No thematic clusters — do not give 3 virtue names, 3 flower names, 3 celestial names etc.

FREE LIST (5): Your 5 most confident recommendations. Should feel immediately, obviously right for this brief.
PREMIUM LIST (20): Go deeper. Rarer finds, more culturally specific, hidden gems, overlooked classics. Names the parent would not discover on their own. Hold the same diversity rules.

Respond ONLY with valid JSON, no markdown, no explanation:
{"free": [...], "premium": [...]}
Each object: {"name": "...", "origin": "...", "meaning": "...", "tags": ["...", "..."]}
Tags: 2–3 short feel descriptors — capture emotional texture, not category (e.g. "quietly confident", "ancient warmth", "modern clarity")`;

  // Fetch with 529 retry logic
  async function fetchWithRetry(body, retries = 3) {
    for (let attempt = 1; attempt <= retries; attempt++) {
      const res = await fetch('https://project-rz9q4.vercel.app/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status !== 529) return res;
      console.warn(`529 overloaded, attempt ${attempt}/${retries} — retrying in 3s`);
      if (attempt < retries) {
        msgEl.textContent = 'Just a moment, almost there…';
        await new Promise(r => setTimeout(r, 3000));
      }
    }
    return null; // all retries exhausted
  }

  // Parse free+premium JSON from response text
  function parseMainResponse(text) {
    const clean = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const start = clean.indexOf('{');
    const end = clean.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('No JSON found');
    const parsed = JSON.parse(clean.slice(start, end + 1));
    if (!parsed.free || !parsed.premium) throw new Error('Invalid structure');
    return parsed;
  }

  try {
    // — Main attempt (with 529 retries) —
    let free = null;
    let premium = null;

    const res = await fetchWithRetry({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      messages: [{ role: 'user', content: prompt }]
    });

    if (res) {
      const data = await res.json();
      const text = data.content?.[0]?.text;
      if (text) {
        try {
          const parsed = parseMainResponse(text);
          free = parsed.free;
          premium = parsed.premium;
        } catch (parseErr) {
          console.error('Main parse error:', parseErr, 'Raw:', text);
        }
      } else {
        console.error('Main call: no content.', 'stop_reason:', data.stop_reason, 'detail:', JSON.stringify(data).slice(0, 300));
      }
    }

    // — Simple fallback prompt if main failed —
    if (!free) {
      console.warn('Main call failed — trying simple fallback prompt');
      msgEl.textContent = 'Just a moment, almost there…';
      const fallbackPrompt = `Suggest 5 baby names. Gender: ${answers.gender}. Style: ${answers.style}. Respond only with valid JSON array, no markdown: [{"name":"...","origin":"...","meaning":"...","tags":["...","..."]}]`;
      try {
        const fbRes = await fetch('https://project-rz9q4.vercel.app/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 800,
            messages: [{ role: 'user', content: fallbackPrompt }]
          })
        });
        const fbData = await fbRes.json();
        const fbText = (fbData.content?.[0]?.text || '').replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
        const arrStart = fbText.indexOf('[');
        const arrEnd = fbText.lastIndexOf(']');
        if (arrStart !== -1 && arrEnd !== -1) {
          free = JSON.parse(fbText.slice(arrStart, arrEnd + 1));
        }
      } catch (fbErr) {
        console.error('Fallback prompt error:', fbErr);
      }
    }

    // — Last resort: hardcoded stock names —
    if (!free) {
      console.warn('Both API calls failed — showing hardcoded stock names');
      free = [
        { name: 'Rowan', origin: 'Celtic', meaning: 'Little red one; the rowan tree', tags: ['nature-rooted', 'gender-neutral', 'timeless'] },
        { name: 'Hazel', origin: 'Old English', meaning: 'The hazel tree; wisdom', tags: ['vintage', 'warm', 'earthy'] },

        { name: 'Lucian', origin: 'Latin', meaning: 'Light; illumination', tags: ['classic', 'elegant', 'radiant'] }
      ];
    }

    clearInterval(msgInterval);
    showResults(free, premium || fallbackPremium());
  } catch (e) {
    console.error('generateNames error:', e);
    clearInterval(msgInterval);
    showResults(fallbackPremium().slice(0, 5), fallbackPremium());
  }
}

};

function selectTier(tier) {
  window._selectedTier = tier;
  [1,2,3].forEach(t => {
    const el = document.getElementById('tier-' + t);
    if (!el) return;
    if (t === tier) {
      el.style.border = '2px solid #C9737A';
      el.style.background = 'rgba(196,105,79,0.2)';
    } else {
      el.style.border = '1.5px solid rgba(247,243,238,0.2)';
      el.style.background = 'rgba(247,243,238,0.08)';
    }
  });
  const cfg = TIER_CONFIG[tier];

  if (stripeBtn) stripeBtn.textContent = 'Pay ' + cfg.price + ' · Apple Pay / Card';

function handleStripe() {
  const tier = window._selectedTier || 2;
  const cfg = TIER_CONFIG[tier];
  window.open(cfg.stripe, '_blank');

}

  const upsellSection = document.getElementById('upsell-section');

}

async function handleEmailCapture() {
  const input = document.getElementById('capture-email-input');
  const email = input ? input.value.trim() : '';
  if (!email || !email.includes('@')) {
    if (input) { input.style.borderColor = 'rgba(201,115,122,0.7)'; input.focus(); }
    return;
  }

  const btn = document.querySelector('.email-capture-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  // Check if this email is already a user in Supabase
  let isExistingUser = false;
  try {
    const checkRes = await fetch(
      `${SUPABASE_URL}/rest/v1/user_status?email=eq.${encodeURIComponent(email)}&select=email`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const checkData = await checkRes.json();
    isExistingUser = Array.isArray(checkData) && checkData.length > 0;
  } catch (e) {
    console.error('User status check failed:', e);
  }

  const form = document.getElementById('email-capture-form');

  if (isExistingUser) {
    localStorage.setItem('nomia_user_email', email);
    if (form) {
      form.innerHTML = `
        <div class="email-capture-confirm" style="display:flex; flex-direction:column; align-items:center; gap:12px;">
          <div>Welcome back! Log in to save these names to your dashboard.</div>
          <a href="dashboard.html" style="display:inline-block; padding:10px 24px; background:var(--dusty-rose); color:#fff; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:13px; text-decoration:none; letter-spacing:0.03em;">Go to dashboard →</a>
        </div>`;
    }
    return;
  }

  // New user — run normal subscribe flow
  try {
    await fetch('https://project-rz9q4.vercel.app/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'subscribe',
        email,
        names: window._freeNames || [],
        quiz_answers: answers || {}
      })
    });
  } catch (e) {
    // Non-fatal — still store locally and confirm
    console.error('Email capture error:', e);
  }

  localStorage.setItem('nomia_user_email', email);

  if (form) {
    form.innerHTML = '<div class="email-capture-confirm">✦ Names saved — check your inbox</div>';
  }
}

function handleSkip() {
  document.getElementById('upsell-section').style.display = 'none';
}
