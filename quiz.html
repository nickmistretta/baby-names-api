<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomia — Find Your Baby's Name</title>
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/nickmistretta/baby-names-api/main/nomia-favicon.svg">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2B3A;
    --navy-deep: #152230;
    --navy-mid: #243548;
    --cream: #FDFAF7;
    --blush: #F2D9D9;
    --rose: #E8B4B8;
    --dusty-rose: #C9737A;
    --silver: #8B9EB0;
    --white: #FFFFFF;
    --terracotta: #C9737A;
    --bark: #FDFAF7;
    --charcoal: #FDFAF7;
    --muted: #8B9EB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(201,115,122,0.06);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }

  .header-leaf {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
    filter: sepia(0.3);
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .header h1 em {
    font-style: italic;
    color: var(--terracotta);
  }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #C9737A, #E8B4B8);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card */
  .question-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(122,92,68,0.08);
    animation: fadeUp 0.6s ease both;
  }

  .question-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--clay);
    font-weight: 400;
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .question-hint {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 28px;
  }

  /* Options */
  .options-grid {
    display: grid;
    gap: 10px;
  }

  .options-grid.cols-2 {
    grid-template-columns: 1fr 1fr;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--navy);
    line-height: 1.4;
  }

  .option-btn:hover {
    border-color: var(--clay);
    background: #FBF7F2;
    transform: translateY(-1px);
  }

  .option-btn.selected {
    border-color: var(--terracotta);
    background: #FDF0EC;
    color: var(--terracotta);
  }

  .option-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 0.5px solid rgba(28,43,58,0.1);
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .option-btn.selected .option-dot {
    background: var(--dusty-rose);
    border-color: var(--terracotta);
  }

  .option-btn.selected .option-dot::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
  }

  /* Text input */
  .text-input {
    width: 100%;
    padding: 14px 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
  }

  .text-input:focus {
    border-color: var(--clay);
  }

  .text-input::placeholder {
    color: var(--muted);
    font-weight: 300;
  }

  /* Gender toggle */
  .gender-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 480px) {
    .gender-toggle {
      grid-template-columns: 1fr;
    }
  }

  .gender-btn {
    flex: 1;
    padding: 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    color: var(--navy);
    transition: all 0.2s;
    text-align: center;
  }

  .gender-btn:hover { border-color: var(--clay); }
  .gender-btn.selected { border-color: var(--terracotta); background: #FDF0EC; color: var(--terracotta); }

  /* Nav buttons */
  .nav {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .btn-back {
    padding: 14px 24px;
    background: transparent;
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: var(--clay); color: var(--navy); }

  .btn-next {
    flex: 1;
    padding: 14px 24px;
    background: var(--dusty-rose);
    border: none;
    border-radius: 12px;
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-next:hover { background: var(--navy); transform: translateY(-1px); }
  .btn-next:disabled { background: var(--sand); color: var(--muted); cursor: not-allowed; transform: none; }

  /* Loading screen */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 20px;
  }

  .loading-pulse-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loading-pulse-wrap::before,
  .loading-pulse-wrap::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.15);
    animation: pulseRing 2.4s ease-out infinite;
  }

  .loading-pulse-wrap::before { width: 100%; height: 100%; animation-delay: 0s; }
  .loading-pulse-wrap::after { width: 75%; height: 75%; animation-delay: 0.4s; }

  .loading-pulse-inner {
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,115,122,0.6) 0%, rgba(201,115,122,0.3) 60%, transparent 100%);
    animation: pulseCore 2.4s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }

  .loading-pulse-ring {
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.08);
    width: 140%;
    height: 140%;
    animation: pulseRing 2.4s ease-out infinite;
    animation-delay: 0.8s;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.6); opacity: 0.8; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .loading-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    animation: fadeUp 0.8s ease both;
  }

  .loading-sub {
    font-size: 16px;
    color: var(--silver);
    font-weight: 300;
    letter-spacing: 0.06em;
    animation: fadeUp 0.8s 0.2s ease both;
    min-height: 24px;
  }

  /* Results screen */
  .results-header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease both;
  }

  .results-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 400;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .results-header p {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  .name-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .name-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(122,92,68,0.12);
  }

  .name-rank {
    font-size: 11px;
    color: var(--clay);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 24px;
    padding-top: 4px;
  }

  .name-info { flex: 1; }

  .name-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 4px;
  }

  .name-origin {
    font-size: 12px;
    color: var(--dusty-rose);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .name-meaning {
    font-size: 13px;
    color: var(--silver);
    font-weight: 300;
    line-height: 1.5;
  }

  .name-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .name-tag {
    padding: 3px 10px;
    background: rgba(253,250,247,0.08);
    border-radius: 99px;
    font-size: 11px;
    color: var(--silver);
    letter-spacing: 0.04em;
  }

  /* Upsell card */
  .upsell-card {
    background: var(--navy-mid);
    border: 0.5px solid rgba(253,250,247,0.1);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    margin-top: 28px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .upsell-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(201,115,122,0.07);
  }

  .upsell-card::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
  }

  .upsell-badge {
    display: inline-block;
    padding: 5px 14px;
    background: var(--dusty-rose);
    border-radius: 99px;
    font-size: 11px;
    color: white;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .upsell-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    color: var(--cream);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }

  .upsell-desc {
    font-size: 14px;
    color: rgba(253,250,247,0.55);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .upsell-includes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 16px 0 24px;
    position: relative;
    z-index: 1;
    text-align: left;
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
  }

  .upsell-item {
    font-size: 13px;
    color: rgba(253,250,247,0.75);
    font-weight: 300;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .upsell-item::before {
    content: '✦';
    color: var(--dusty-rose);
    font-size: 10px;
    flex-shrink: 0;
  }

  .upsell-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    color: var(--cream);
    position: relative;
    z-index: 1;
    margin-bottom: 4px;
  }

  .upsell-price span {
    font-size: 18px;
    vertical-align: super;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  .upsell-once {
    font-size: 12px;
    color: rgba(253,250,247,0.4);
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  .btn-paypal {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    background: #FFC439;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #003087;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
    letter-spacing: 0.02em;
  }

  .btn-paypal:hover { background: #f0b429; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,196,57,0.3); }

  .paypal-logo {
    font-weight: 700;
    font-size: 16px;
  }

  .skip-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(253,250,247,0.35);
    cursor: pointer;
    position: relative;
    z-index: 1;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .skip-link:hover { color: rgba(253,250,247,0.7); }

  /* Locked names */
  .locked-names {
    margin-top: 16px;
    position: relative;
  }

  .locked-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(28,43,58,0) 0%, rgba(28,43,58,0.98) 50%);
    z-index: 2;
    border-radius: 16px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16px;
  }

  .locked-hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  .name-card.blurred {
    filter: blur(4px);
    pointer-events: none;
    user-select: none;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* TOP NAV */
  .hamburger { display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:4px; z-index:101; }
  .hamburger span { display:block; width:24px; height:1.5px; background:white; border-radius:99px; transition:all 0.3s ease; }
  .hamburger.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity:0; }
  .hamburger.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }
  .mobile-menu { display:none; position:fixed; top:96px; left:0; right:0; background:#152230; border-bottom:0.5px solid rgba(255,255,255,0.08); flex-direction:column; padding:16px 24px 24px; gap:4px; z-index:99; }

</style>
</head>

let current = 0;
let answers = {};

function renderQ() {
  const q = questions[current];
  const card = document.getElementById('question-card');
  const pct = Math.round(((current + 1) / questions.length) * 100);

  document.getElementById('progress-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-back').style.display = current > 0 ? 'block' : 'none';

  let optionsHTML = '';

  if (q.type === 'gender') {
    optionsHTML = `<div class="gender-toggle">` +
      q.options.map((o, i) => `<button class="gender-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="gender-btn">${o}</button>`).join('') +
      `</div>`;
  } else if (q.type === 'single') {
    const grid = q.cols === 2 ? 'options-grid cols-2' : 'options-grid';
    optionsHTML = `<div class="${grid}">` +
      q.options.map((o, i) => `
        <button class="option-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="option-btn">
          <span class="option-dot"></span>${o}
        </button>`).join('') +
      `</div>`;
  } else if (q.type === 'text') {
    optionsHTML = `<input class="text-input" type="text" placeholder="${q.placeholder}" id="text-input-${q.id}" value="${answers[q.id] || ''}">`;
  }

  card.innerHTML = `
    <div class="question-label">${q.label}</div>
    <div class="question-text">${q.text}</div>
    <div class="question-hint">${q.hint}</div>
    ${optionsHTML}
  `;

  // Attach click listeners via JS (safe for special chars & emojis)
  card.querySelectorAll('[data-qid]').forEach(btn => {
    btn.addEventListener('click', function() {
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.val);
      const cls = this.dataset.cls;
      const q = questions[current];
      answers[qid] = q.options[idx];
      card.querySelectorAll('.' + cls).forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  if (q.type === 'text') {
    const inp = card.querySelector('.text-input');
    if (inp) inp.addEventListener('input', function() { answers[q.id] = this.value; });
  }

  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.5s ease both'; });

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = current === questions.length - 1 ? 'Find my names ✦' : 'Continue →';
}


function nextQ() {
  const q = questions[current];
  if (q.type !== 'text' && !answers[q.id]) {
    document.getElementById('question-card').style.animation = 'none';
    document.getElementById('question-card').offsetHeight;
    document.getElementById('question-card').style.animation = 'shake 0.3s ease';
    return;
  }
  if (current < questions.length - 1) {
    current++;
    renderQ();
  } else {
    generateNames();
  }
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }

const loadingMessages = [
  'Weaving together your preferences…',
  'Exploring name origins and meanings…',
  'Matching seasonal energy…',

async function generateNames() {
  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-loading').classList.add('active');

  let msgIdx = 0;
  const msgEl = document.getElementById('loading-msg');
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % loadingMessages.length;
    msgEl.textContent = loadingMessages[msgIdx];
  }, 1800);

  const prompt = `You are a baby name expert. Based on these preferences, suggest exactly 5 baby names for the FREE list and 20 additional names for the PREMIUM list.

Preferences:
- Gender: ${answers.gender || 'neutral'}
- Style: ${answers.style || 'classic'}
- Cultural background: ${answers.culture || 'no preference'}
- Name vibe: ${answers.vibe || 'warm'}
- Sound preferences: ${answers.sound || 'none specified'}
- Meaning themes: ${answers.meaning || 'no preference'}
- Birth season: ${answers.season || 'not specified'}

Respond ONLY with valid JSON in this exact format, no markdown, no explanation:
{
  "free": [
    {"name": "...", "origin": "...", "meaning": "...", "tags": ["...", "..."]}
  ],
  "premium": [
    {"name": "...", "origin": "...", "meaning": "...", "tags": ["...", "..."]}
  ]
}

Make names feel warm, considered, and beautifully matched to the preferences. Vary the origins and styles. Tags should be 2-3 short descriptors like "timeless", "soft sound", "nature-rooted", etc.`;

  try {
    const res = await fetch('https://project-rz9q4.vercel.app/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    
    let rawText = '';
    if (data.content && data.content[0] && data.content[0].text) {
      rawText = data.content[0].text;
    } else {
      throw new Error('No content in response');
    }
    
    rawText = rawText.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const jsonStart = rawText.indexOf('{');
    const jsonEnd = rawText.lastIndexOf('}');
    if (jsonStart === -1 || jsonEnd === -1) throw new Error('No JSON found');
    const jsonStr = rawText.slice(jsonStart, jsonEnd + 1);
    const parsed = JSON.parse(jsonStr);
    if (!parsed.free || !parsed.premium) throw new Error('Invalid structure');

    clearInterval(msgInterval);
    showResults(parsed.free, parsed.premium);
  } catch (e) {
    console.error('Parse error:', e);
    clearInterval(msgInterval);
    showResults(fallbackFree(answers), fallbackPremium());
  }
}

  3: { names: 999, price: '$9.99', stripe: 'https://buy.stripe.com/fZueVe936b4bcQ0eTv2Fa02', paypal: 'https://www.paypal.com/paypalme/YOURHANDLE/9.99' },
};

function selectTier(tier) {
  window._selectedTier = tier;
  [1,2,3].forEach(t => {
    const el = document.getElementById('tier-' + t);
    if (!el) return;
    if (t === tier) {
      el.style.border = '2px solid #C9737A';
      el.style.background = 'rgba(196,105,79,0.2)';
    } else {
      el.style.border = '1.5px solid rgba(247,243,238,0.2)';
      el.style.background = 'rgba(247,243,238,0.08)';
    }
  });
  const cfg = TIER_CONFIG[tier];
  const stripeBtn = document.getElementById('stripe-btn-text');
  const paypalBtn = document.getElementById('paypal-btn-text');
  if (stripeBtn) stripeBtn.textContent = 'Pay ' + cfg.price + ' · Apple Pay / Card';
  if (paypalBtn) paypalBtn.textContent = 'Pay ' + cfg.price + ' with PayPal';
}

function handleStripe() {
  const emailInput = document.getElementById('upsell-email');
  const emailError = document.getElementById('email-error');
  const email = emailInput ? emailInput.value.trim() : '';
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if (!emailValid) {
    if (emailError) emailError.style.display = 'block';
    if (emailInput) emailInput.focus();
    return;
  }

  if (emailError) emailError.style.display = 'none';
  localStorage.setItem('nameforest_email', email);

  const tier = window._selectedTier || 1;
  const cfg = TIER_CONFIG[tier];
  window.open(cfg.stripe + '?prefilled_email=' + encodeURIComponent(email), '_blank');
  showPostPaymentMessage(email);
}

function handlePayPalWithEmail() {
  const emailInput = document.getElementById('upsell-email');
  const emailError = document.getElementById('email-error');
  const email = emailInput ? emailInput.value.trim() : '';
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  if (!emailValid) {
    if (emailError) emailError.style.display = 'block';
    if (emailInput) emailInput.focus();
    return;
  }

  if (emailError) emailError.style.display = 'none';
  localStorage.setItem('nameforest_email', email);

  // REPLACE YOURHANDLE with your actual PayPal.me username
  const tier = window._selectedTier || 1;
  const cfg = TIER_CONFIG[tier];
  window.open(cfg.paypal, '_blank');

  showPostPaymentMessage(email);
}

            Reopen Payment Page
