<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomia — Discover New Names</title>
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/nickmistretta/baby-names-api/main/nomia-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2B3A;
    --navy-deep: #152230;
    --navy-mid: #243548;
    --cream: #FDFAF7;
    --blush: #F2D9D9;
    --rose: #E8B4B8;
    --dusty-rose: #C9737A;
    --silver: #8B9EB0;
    --white: #FFFFFF;
    --terracotta: #C9737A;
    --muted: #8B9EB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(201,115,122,0.06);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease both;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .header h1 em { font-style: italic; color: var(--terracotta); }

  .header p {
    font-size: 15px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #C9737A, #E8B4B8);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card */
  .question-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(122,92,68,0.08);
    animation: fadeUp 0.6s ease both;
  }

  .question-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dusty-rose);
    font-weight: 400;
    margin-bottom: 12px;
  }

  .question-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .question-hint {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 28px;
  }

  /* Options */
  .options-grid { display: grid; gap: 10px; }
  .options-grid.cols-2 { grid-template-columns: 1fr 1fr; }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--navy);
    line-height: 1.4;
  }

  .option-btn:hover { border-color: var(--dusty-rose); background: #FBF7F2; transform: translateY(-1px); }
  .option-btn.selected { border-color: var(--terracotta); background: #FDF0EC; color: var(--terracotta); }

  .option-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 0.5px solid rgba(28,43,58,0.1);
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }

  .option-btn.selected .option-dot { background: var(--dusty-rose); border-color: var(--terracotta); }
  .option-btn.selected .option-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: white; }

  /* Text input */
  .text-input {
    width: 100%;
    padding: 14px 18px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--navy);
    outline: none;
    transition: border-color 0.2s;
  }

  .text-input:focus { border-color: var(--dusty-rose); }
  .text-input::placeholder { color: var(--muted); font-weight: 300; }

  /* Gender toggle */
  .gender-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  @media (max-width: 480px) { .gender-toggle { grid-template-columns: 1fr; } }

  .gender-btn {
    padding: 16px;
    background: var(--cream);
    border: 0.5px solid rgba(28,43,58,0.1);
    border-radius: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--navy);
    transition: all 0.2s;
    text-align: center;
  }

  .gender-btn:hover { border-color: var(--dusty-rose); }
  .gender-btn.selected { border-color: var(--terracotta); background: #FDF0EC; color: var(--terracotta); }

  /* Nav */
  .nav {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .btn-back {
    padding: 14px 24px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: rgba(255,255,255,0.3); color: var(--cream); }

  .btn-next {
    flex: 1;
    padding: 14px 24px;
    background: var(--dusty-rose);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-next:hover { background: var(--navy-deep); transform: translateY(-1px); }
  .btn-next:disabled { background: rgba(255,255,255,0.1); color: var(--muted); cursor: not-allowed; transform: none; }

  /* Loading */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 20px;
  }

  .loading-pulse-wrap {
    position: relative;
    width: 240px; height: 240px;
    margin: 0 auto 48px;
    display: flex; align-items: center; justify-content: center;
  }

  .loading-pulse-wrap::before,
  .loading-pulse-wrap::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.15);
    animation: pulseRing 2.4s ease-out infinite;
  }

  .loading-pulse-wrap::before { width: 100%; height: 100%; animation-delay: 0s; }
  .loading-pulse-wrap::after { width: 75%; height: 75%; animation-delay: 0.4s; }

  .loading-pulse-inner {
    width: 50%; height: 50%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,115,122,0.6) 0%, rgba(201,115,122,0.3) 60%, transparent 100%);
    animation: pulseCore 2.4s ease-in-out infinite;
    position: relative; z-index: 1;
  }

  .loading-pulse-ring {
    position: absolute;
    border-radius: 50%;
    background: rgba(201,115,122,0.08);
    width: 140%; height: 140%;
    animation: pulseRing 2.4s ease-out infinite;
    animation-delay: 0.8s;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.6); opacity: 0.8; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }

  @keyframes pulseCore {
    0%, 100% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .loading-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    animation: fadeUp 0.8s ease both;
  }

  .loading-sub {
    font-size: 16px;
    color: var(--silver);
    font-weight: 300;
    letter-spacing: 0.06em;
    animation: fadeUp 0.8s 0.2s ease both;
    min-height: 24px;
  }

  /* Results */
  .results-header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease both;
  }

  .results-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 400;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .results-header p { font-size: 14px; color: var(--muted); font-weight: 300; }

  .name-card {
    background: var(--white);
    border: 0.5px solid rgba(28,43,58,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .name-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(122,92,68,0.12); }

  .save-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: rgba(28,43,58,0.2);
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    transition: all 0.2s;
    align-self: center;
    line-height: 1;
  }

  .save-btn:hover { color: var(--dusty-rose); transform: scale(1.2); }
  .save-btn.saved { color: var(--dusty-rose); cursor: default; }
  .save-btn:disabled { cursor: default; }

  .name-rank {
    font-size: 11px;
    color: var(--dusty-rose);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 24px;
    padding-top: 4px;
  }

  .name-info { flex: 1; }

  .name-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 4px;
  }

  .name-origin {
    font-size: 12px;
    color: var(--dusty-rose);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .name-meaning { font-size: 13px; color: var(--silver); font-weight: 300; line-height: 1.5; }

  .name-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .name-tag {
    padding: 3px 10px;
    background: rgba(28,43,58,0.05);
    border-radius: 99px;
    font-size: 11px;
    color: var(--silver);
    letter-spacing: 0.04em;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @media (max-width: 480px) { .question-card { padding: 28px 20px; } }
</style>
</head>
<body>

<div class="container">

  <!-- QUIZ SCREEN -->
  <div class="screen active" id="screen-quiz">
    <div class="header">
      <div style="text-align:center; margin-bottom:16px;">
        <svg style="height:80px;width:auto;" viewBox="20 18 400 148" xmlns="http://www.w3.org/2000/svg">

          <text x="108" y="108" font-family="Cormorant Garamond, Georgia, serif" font-size="88" font-weight="300" font-style="italic" fill="#FDFAF7" letter-spacing="4">nomia</text>
          <text x="110" y="140" font-family="DM Sans, sans-serif" font-size="14" font-weight="400" fill="#FDFAF7" letter-spacing="4">FIND THE PERFECT BABY NAME</text>
        </svg>
      </div>
      <h1>Find the <em>perfect</em> name for your little one</h1>
      <p>Answer a few thoughtful questions and we'll suggest names that feel just right.</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progress-label">Question 1 of 7</span>
        <span id="progress-pct">14%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:14%"></div></div>
    </div>

    <div class="question-card" id="question-card"></div>

    <div class="nav">
      <button class="btn-back" id="btn-back" onclick="prevQ()" style="display:none">← Back</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()">Continue →</button>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div class="screen" id="screen-loading">
    <div class="loading-screen">
      <div class="loading-pulse-wrap">
        <div class="loading-pulse-ring"></div>
        <div class="loading-pulse-inner"></div>
      </div>
      <div class="loading-text">Finding your names…</div>
      <div class="loading-sub" id="loading-msg">Weaving together your preferences</div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="screen" id="screen-results">
    <div class="results-header">
      <h2>Your curated name list</h2>
      <p id="results-sub">25 names chosen just for you</p>
    </div>
    <div id="names-list"></div>
    <div id="bottom-actions"></div>
  </div>

</div>

<script>
const questions = [
  {
    id: 'gender',
    label: 'Step 1',
    text: 'What gender are you hoping to find names for?',
    hint: 'You can always explore all options later.',
    type: 'gender',
    options: ['Girl', 'Boy', 'Gender-neutral', 'Surprise me']
  },
  {
    id: 'style',
    label: 'Step 2',
    text: 'What style speaks to you?',
    hint: 'Pick the one that feels most like your family.',
    type: 'single',
    options: ['Classic & timeless', 'Modern & fresh', 'Rare & unique', 'Vintage revival', 'Nature-inspired', 'Short & strong']
  },
  {
    id: 'culture',
    label: 'Step 3',
    text: 'Any cultural or heritage roots to honor?',
    hint: 'This helps us suggest names with meaningful lineage.',
    type: 'single',
    options: ['European / Western', 'Latin / Spanish', 'African / African-American', 'Asian / East Asian', 'South Asian', 'Middle Eastern', 'Indigenous', 'No preference']
  },
  {
    id: 'vibe',
    label: 'Step 4',
    text: 'What feeling should the name carry?',
    hint: 'Think about how it will feel to call out across a park.',
    type: 'single',
    options: ['Gentle & soft', 'Bold & strong', 'Playful & bright', 'Mysterious & deep', 'Warm & friendly', 'Elegant & refined']
  },
  {
    id: 'sound',
    label: 'Step 5',
    text: 'Any letter or sound preferences?',
    hint: 'E.g. starts with A, ends in -a, sounds like river',
    type: 'text',
    placeholder: 'Optional — leave blank to skip'
  },
  {
    id: 'meaning',
    label: 'Step 6',
    text: 'What should the name mean or represent?',
    hint: 'Pick themes that resonate with your hopes for them.',
    type: 'single',
    options: ['Light & radiance', 'Strength & courage', 'Nature & earth', 'Love & grace', 'Wisdom & clarity', 'Joy & laughter', 'Peace & calm', 'No preference']
  },
  {
    id: 'season',
    label: 'Step 7',
    text: 'When is your little one expected to arrive?',
    hint: 'Some names carry beautiful seasonal energy.',
    type: 'single',
    cols: 2,
    options: ['Spring', 'Summer', 'Autumn', 'Winter', 'Already here', 'Not sure yet']
  }
];

let current = 0;
let answers = {};

function renderQ() {
  const q = questions[current];
  const card = document.getElementById('question-card');
  const pct = Math.round(((current + 1) / questions.length) * 100);

  document.getElementById('progress-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-back').style.display = current > 0 ? 'block' : 'none';

  let optionsHTML = '';

  if (q.type === 'gender') {
    optionsHTML = `<div class="gender-toggle">` +
      q.options.map((o, i) => `<button class="gender-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="gender-btn">${o}</button>`).join('') +
      `</div>`;
  } else if (q.type === 'single') {
    const grid = q.cols === 2 ? 'options-grid cols-2' : 'options-grid';
    optionsHTML = `<div class="${grid}">` +
      q.options.map((o, i) => `
        <button class="option-btn${answers[q.id] === o ? ' selected' : ''}" data-qid="${q.id}" data-val="${i}" data-cls="option-btn">
          <span class="option-dot"></span>${o}
        </button>`).join('') +
      `</div>`;
  } else if (q.type === 'text') {
    optionsHTML = `<input class="text-input" type="text" placeholder="${q.placeholder}" id="text-input-${q.id}" value="${answers[q.id] || ''}">`;
  }

  card.innerHTML = `
    <div class="question-label">${q.label}</div>
    <div class="question-text">${q.text}</div>
    <div class="question-hint">${q.hint}</div>
    ${optionsHTML}
  `;

  card.querySelectorAll('[data-qid]').forEach(btn => {
    btn.addEventListener('click', function() {
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.val);
      const cls = this.dataset.cls;
      answers[qid] = questions[current].options[idx];
      card.querySelectorAll('.' + cls).forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  if (q.type === 'text') {
    const inp = card.querySelector('.text-input');
    if (inp) inp.addEventListener('input', function() { answers[q.id] = this.value; });
  }

  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.5s ease both'; });

  document.getElementById('btn-next').textContent = current === questions.length - 1 ? 'Find my names ✦' : 'Continue →';
}

function nextQ() {
  const q = questions[current];
  if (q.type !== 'text' && !answers[q.id]) {
    const card = document.getElementById('question-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'shake 0.3s ease';
    return;
  }
  if (current < questions.length - 1) {
    current++;
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    generateNames();
  }
}

function prevQ() {
  if (current > 0) { current--; renderQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

const loadingMessages = [
  'Weaving together your preferences…',
  'Exploring name origins and meanings…',
  'Matching seasonal energy…',
  'Curating your personal collection…'
];

async function generateNames() {
  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-loading').classList.add('active');

  let msgIdx = 0;
  const msgEl = document.getElementById('loading-msg');
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % loadingMessages.length;
    msgEl.textContent = loadingMessages[msgIdx];
  }, 1800);

  const prompt = `You are a baby name expert. Based on these preferences, suggest exactly 25 beautifully curated baby names.

Preferences:
- Gender: ${answers.gender || 'neutral'}
- Style: ${answers.style || 'classic'}
- Cultural background: ${answers.culture || 'no preference'}
- Name vibe: ${answers.vibe || 'warm'}
- Sound preferences: ${answers.sound || 'none specified'}
- Meaning themes: ${answers.meaning || 'no preference'}
- Birth season: ${answers.season || 'not specified'}

Respond ONLY with a valid JSON array, no markdown, no explanation:
[{"name": "...", "origin": "...", "meaning": "...", "tags": ["...", "..."]}]

Make names feel warm, considered, and beautifully matched to the preferences. Vary the origins and styles. Tags should be 2-3 short descriptors like "timeless", "soft sound", "nature-rooted", etc.`;

  try {
    const res = await fetch('https://project-rz9q4.vercel.app/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    let rawText = '';
    if (data.content && data.content[0] && data.content[0].text) {
      rawText = data.content[0].text;
    } else {
      throw new Error('No content in response');
    }

    rawText = rawText.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    const jsonStart = rawText.indexOf('[');
    const jsonEnd = rawText.lastIndexOf(']');
    if (jsonStart === -1 || jsonEnd === -1) throw new Error('No JSON found');
    const names = JSON.parse(rawText.slice(jsonStart, jsonEnd + 1));

    // Brevo subscribe + save quiz answers — these are fine to keep
    if (userEmail) {
      fetch('https://project-rz9q4.vercel.app/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'subscribe', email: userEmail })
      });
      fetch('https://project-rz9q4.vercel.app/api/save-answers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, answers })
      });
    }

    // ✅ No auto-save of names — user saves individually via heart button

    clearInterval(msgInterval);
    showResults(names);
  } catch (e) {
    console.error('Parse error:', e);
    clearInterval(msgInterval);
    showResults(fallbackNames());
  }
}

function fallbackNames() {
  return [
    { name: 'Rowan', origin: 'Celtic', meaning: 'Little red one; the rowan tree', tags: ['nature-rooted', 'gender-neutral', 'timeless'] },
    { name: 'Hazel', origin: 'Old English', meaning: 'The hazel tree; wisdom', tags: ['vintage', 'warm', 'earthy'] },
    { name: 'Soren', origin: 'Scandinavian', meaning: 'Stern; serious; thunder', tags: ['modern', 'strong', 'unique'] },
    { name: 'Wren', origin: 'English', meaning: 'Small bird; free spirit', tags: ['nature', 'short', 'lyrical'] },
    { name: 'Lucian', origin: 'Latin', meaning: 'Light; illumination', tags: ['classic', 'elegant', 'radiant'] },
    { name: 'Isolde', origin: 'Celtic', meaning: 'Ice ruler; she who is gazed upon', tags: ['rare', 'romantic', 'literary'] },
    { name: 'Caspian', origin: 'Latin', meaning: 'Of the Caspian sea', tags: ['adventurous', 'literary', 'strong'] },
    { name: 'Elowen', origin: 'Cornish', meaning: 'Elm tree', tags: ['nature', 'rare', 'soft'] },
    { name: 'Idris', origin: 'Welsh', meaning: 'Ardent lord; fiery', tags: ['strong', 'mythic', 'short'] },
    { name: 'Seraphine', origin: 'Hebrew', meaning: 'Fiery, burning; angelic', tags: ['heavenly', 'rare', 'elegant'] }
  ];
}

// Track saved names to prevent double-saves
const savedNames = new Set();

async function saveName(name, btn) {
  if (!userEmail || savedNames.has(name.name)) return;
  btn.textContent = '♥';
  btn.classList.add('saved');
  btn.disabled = true;
  savedNames.add(name.name);
  try {
    await fetch('https://project-rz9q4.vercel.app/api/save-names', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail, names: [name] })
    });
  } catch (e) {
    console.error('Save failed', e);
    btn.textContent = '♡';
    btn.classList.remove('saved');
    btn.disabled = false;
    savedNames.delete(name.name);
  }
}

function showResults(names) {
  document.getElementById('screen-loading').classList.remove('active');
  document.getElementById('screen-results').classList.add('active');
  document.getElementById('results-sub').textContent = `${names.length} names curated just for you`;

  // Store for save callbacks
  window._resultNames = names;

  document.getElementById('names-list').innerHTML = names.map((n, i) => `
    <div class="name-card" style="animation-delay:${i * 0.05}s">
      <div class="name-rank">${String(i+1).padStart(2,'0')}</div>
      <div class="name-info">
        <div class="name-title">${n.name}</div>
        <div class="name-origin">${n.origin}</div>
        <div class="name-meaning">${n.meaning}</div>
        <div class="name-tags">${(n.tags||[]).map(t => `<span class="name-tag">${t}</span>`).join('')}</div>
      </div>
      <button class="save-btn" onclick="saveName(window._resultNames[${i}], this)" title="Save to dashboard">♡</button>
    </div>
  `).join('');

  document.getElementById('bottom-actions').innerHTML = `
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:32px; align-items:center;">
      <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--dusty-rose); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:300; color:white; cursor:pointer; transition:all 0.2s; letter-spacing:0.04em;">
        ✦ Run another quiz
      </button>
      <a href="dashboard.html" style="width:100%; padding:14px; background:transparent; border:0.5px solid rgba(253,250,247,0.2); border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:300; color:rgba(253,250,247,0.6); text-align:center; text-decoration:none; letter-spacing:0.04em; display:block;">
        ← Back to dashboard
      </a>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Auth check
const userEmail = localStorage.getItem('nomia_user_email');
if (!userEmail) window.location.href = 'dashboard.html';

renderQ();
</script>
